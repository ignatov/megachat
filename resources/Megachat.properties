error.projectName=The name of a new project must be one directory name of at most 100 characters: letters, digits, ., _ and -, with a letter, a digit or _ first.
error.newRoot=The directory of the new projects, the setting projects.newRoot, must be in the home directory of the user or in a root of MEGACHAT_PROJECT_ROOTS, and not in a hidden directory.
error.search=Megachat could not update its history search index. Searches catch up on the next query.
