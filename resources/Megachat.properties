error.stopPlatform=agents_stop works only where agents_running lists the processes, and this version of Megachat reads them on macOS only, not on {0}. No signal went out.
error.stopEvent=Only a turn of the user can stop a process. An automatic turn, such as a child result, the summary of the past sessions or the morning report, cannot. No signal went out.
error.stopClosed=The stop request is not open: it got an answer, it expired, a newer request replaced it, its turn ended, or the daemon restarted. No signal went out.
