error.steerLimit=The task has 16 added messages already. Wait for its result, then use agents_send.
error.steerLength=A message to a child task can have at most 64,000 characters. Split the text into more messages of at most 64,000 characters each.
error.projectName=The name of a new project must be one directory name of at most 100 characters: letters, digits, ., _ and -, with a letter, a digit or _ first.
error.newRoot=The directory of the new projects, the setting projects.newRoot, must be in the home directory of the user or in a root of MEGACHAT_PROJECT_ROOTS, and no directory below the home directory or the root on its path can be hidden.
error.sessionsIndexOff=The index of past sessions is off, so Megachat cannot read pi sessions. Only the user can turn it on, with the setting sessions.index.
error.sessionsLogsOff=The index of past sessions is off, so Megachat reads no session log. Only the user can turn it on, with the setting sessions.index.
error.search=Megachat could not update its history search index. Searches catch up on the next query.
