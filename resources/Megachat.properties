install.ide=The IDE starts Megachat with npx and with its own Node.js, not with the Node.js of this terminal. The first start in the IDE takes from about 30 seconds to about 2 minutes, because npx installs the last release in the npm cache of the IDE. Each later start asks GitHub for the last release.
