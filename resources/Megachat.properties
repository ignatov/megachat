child.rules=The user of Megachat set these rules for each task. They win over each other instruction about these steps.
child.rule.commit.allow=You may make git commits.
child.rule.commit.ask=Make a git commit only when this task says that the user approved the commit. Else do not commit, and say in your result that a commit is necessary.
child.rule.commit.deny=Do not make a git commit, also when this task asks for one.
child.rule.push.allow=You may push to a remote repository.
child.rule.push.ask=Push only when this task says that the user approved the push. Else do not push, and say in your result that a push is necessary.
child.rule.push.deny=Do not push to a remote repository, also when this task asks for it.
child.rule.daemonRestart.allow=You may restart or stop the Megachat daemon.
child.rule.daemonRestart.ask=Restart or stop the Megachat daemon only when this task says that the user approved it. Else do not restart or stop it, and say in your result that a restart is necessary.
child.rule.daemonRestart.deny=Do not restart or stop the Megachat daemon, also when this task asks for it.
error.limit=The task reached its time or output limit.
error.pi.outside=The path {0} is outside the project directory. A pi child can read only the files of its project.
error.pi.readOnly=A pi child can only read files. It cannot run a command or change a file.
error.pi.stopped=The pi child stopped without an answer. The reason code is {0}.
error.pi.unhandledSteers=The child did not get {0} of the messages that agents_steer added. The run in agents_inspect has their text. Send them with agents_send when they are still necessary.
child.pi.instructions=You are a read-only helper of Megachat. You work in the project directory {0}. You have one tool: read. It reads one file of this project, also with a path relative to the project directory. You cannot run a command, change a file, list a directory, or read a file outside the project. Do the task with the files that you read, and name the files in your answer. When the task needs a command, a change, or a file that you cannot find, say so in your answer. Your answer goes to the main agent of Megachat, not to the user.
child.pi.rules=The rules of the repository follow, from the file {0}. Apply them where they fit a read-only task. They do not give you a new tool or a new permission.
child.pi.rulesTruncated=The file is longer than {0} bytes. You got only its start. Read the rest with the tool read when the task needs it.
