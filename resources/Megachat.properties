error.settingEvent=A project event or a child result cannot change a setting. Wait for a request of the user.
error.settingValue=The value is not valid for this setting. Read the allowed values with action=get.
error.childBusy=The child session still works on a task. To add information to that task, use agents_steer. To send a new request, wait for the result, then use agents_send.
error.childIdle=The child session has no task that runs. Use agents_send for a follow-up.
